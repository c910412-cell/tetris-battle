# 手動觸發（GitHub 網頁上的 repo → Actions → 這個 workflow → "Run workflow"
# 按鈕），把 Godot 專案匯出成一個「沒有簽章」的 .ipa——不需要任何 Apple
# 憑證/Secrets，簽章這一步刻意留給你電腦上的 AltStore/AltServer 事後做
# （見專案討論紀錄：免費 Apple ID 的簽章一定要互動登入，沒辦法在這裡自動化）。
#
# 這個檔案完全沒辦法在寫它的這個環境裡實際跑一次驗證（這裡沒有 macOS
# runner 可以測），第一次真的跑很可能要根據實際錯誤訊息調整幾個地方
# （最可能出問題的是下面標注「可能要調整」的那幾處：Godot 產生的 Xcode
# scheme 名稱、.xcodeproj 檔名，這些要看真正跑出來的 Xcode 專案結構才能
# 確認）。

name: Export iOS (unsigned)

on:
  workflow_dispatch: {}

env:
  # 要跟你編輯器實際在用的 Godot 版本一致（專案是 4.7.1）。
  GODOT_VERSION: "4.7.1"
  # GitHub release 標籤（下載網址用）跟 Godot 編輯器實際找 export templates
  # 用的本機資料夾名稱格式不一樣——前者是連字號 "4.7.1-stable"，後者是
  # 句點 "4.7.1.stable"（見 `godot --version` 印出來的
  # "v4.7.1.stable.official.xxxx"，Godot 找模板時用這個格式去掉
  # ".official.xxxx" 尾巴）。第一次真的跑失敗就是把這兩個搞混，這裡分開
  # 兩個變數避免再犯。
  GODOT_RELEASE_TAG: "4.7.1-stable"
  GODOT_TEMPLATE_DIR: "4.7.1.stable"
  EXPORT_PRESET: "iOS"
  SCHEME_NAME: "TetrisBattle"
  BUNDLE_NAME: "TetrisBattle"

jobs:
  export-ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Bump iOS build number
        # 每次不管改沒改版號都用同一個 "1.0",AltStore/iOS 有時候會把它當
        # 「同一個版本」而不完整替換舊的 .app,side load 完看起來像是根本
        # 沒換到新的 build（改了程式碼/資源結果手機上還是舊的）。這裡把
        # CFBundleVersion（Godot 匯出設定裡的 application/version）換成
        # 這次 workflow run 的流水號,保證每次側裝都是「新版本」,iOS 一定
        # 會整包换掉。CFBundleShortVersionString（application/short_version,
        # 使用者看到的「1.0」）不動。
        run: |
          set -euo pipefail
          sed -i.bak "s/^application\/version=\".*\"/application\/version=\"${GITHUB_RUN_NUMBER}\"/" export_presets.cfg
          rm -f export_presets.cfg.bak
          grep "application/version=" export_presets.cfg

      - name: Cache Godot editor + export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/Library/Application Support/Godot/export_templates
          key: godot-${{ env.GODOT_RELEASE_TAG }}-macos

      - name: Download Godot editor (macOS) + export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/godot
          curl -L -o ~/godot/godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE_TAG}/Godot_v${GODOT_VERSION}-stable_macos.universal.zip"
          unzip -q ~/godot/godot.zip -d ~/godot
          curl -L -o ~/godot/templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_RELEASE_TAG}/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p ~/Library/Application\ Support/Godot/export_templates
          unzip -q ~/godot/templates.tpz -d ~/Library/Application\ Support/Godot/export_templates
          # .tpz 解壓出來會多一層 "templates/" 資料夾，Godot 期待的路徑是
          # export_templates/<版本字串>/ 直接放檔案，這裡把它搬到正確位置
          # ——注意資料夾名稱要用句點格式（GODOT_TEMPLATE_DIR），不是下載
          # 網址用的連字號格式（GODOT_RELEASE_TAG），這兩個是分開的。
          mv ~/Library/Application\ Support/Godot/export_templates/templates \
            ~/Library/Application\ Support/Godot/export_templates/${GODOT_TEMPLATE_DIR}

      - name: Locate Godot editor binary
        run: |
          set -euo pipefail
          GODOT_BIN=$(find ~/godot -type f -name "Godot*" -perm +111 | head -n 1)
          echo "GODOT_BIN=${GODOT_BIN}" >> "$GITHUB_ENV"
          chmod +x "${GODOT_BIN}"
          "${GODOT_BIN}" --version

      - name: Import project assets
        run: |
          set -euo pipefail
          "${GODOT_BIN}" --headless --path . --import

      - name: Verify custom CJK font actually imported
        # 之前中文字型在 iOS 上顯示亂碼,懷疑是這個 15MB 的 .otf 在
        # headless import 這步靜靜失敗(Godot 不一定會讓整個 import 指令
        # 回傳非 0,失敗有可能被吃掉),下一步 export 照樣「成功」但其實
        # 缺了字型、退回沒有中文字的內建字型。這裡直接檢查匯入後的快取
        # 檔案有沒有真的生成,沒有就讓整個 workflow 失敗,而不是生出一個
        # 看起來成功、實際上還是亂碼的 .ipa。
        run: |
          set -euo pipefail
          if ! find .godot/imported -iname "GenSenRounded2TW-B.otf-*.fontdata" | grep -q .; then
            echo "::error::自訂中文字型沒有被匯入成功(.godot/imported 裡找不到 GenSenRounded2TW-B 的 .fontdata),中文字在手機上會變亂碼。"
            exit 1
          fi
          echo "字型匯入確認 OK："
          find .godot/imported -iname "GenSenRounded2TW-B.otf-*.fontdata"

      - name: Export Xcode project from Godot
        # export_presets.cfg 的 iOS preset 已經設成
        # application/export_project_only=true——這一步只會產生一個 Xcode
        # 專案（沒有簽章、沒有真的打包 .ipa），簽章交給下面的 xcodebuild
        # 手動控制，避免被 Godot 內建的簽章流程卡住（那個流程預設會想要
        # 用到 code_sign_identity/provisioning_profile 這些我們沒有填的
        # 欄位）。
        run: |
          set -euo pipefail
          mkdir -p build/ios_project
          "${GODOT_BIN}" --headless --path . --export-debug "${EXPORT_PRESET}" build/ios_project/${BUNDLE_NAME}.ipa
          find build/ios_project -maxdepth 2

      - name: Build unsigned .app with xcodebuild
        # CODE_SIGNING_ALLOWED=NO 是關鍵——完全不簽章，產生一個「裸」的
        # .app，之後用 AltStore/Sideloadly 在你自己電腦上用免費 Apple ID
        # 重新簽過才能裝到手機。SCHEME_NAME 可能要調整：Godot 產生的
        # scheme 通常跟 bundle 名稱一致，如果這步找不到 scheme，看
        # 上一步 `find` 印出來的 .xcodeproj 路徑，用
        # `xcodebuild -list -project <path>` 查真正的 scheme 名稱再回來改。
        run: |
          set -euo pipefail
          XCODEPROJ=$(find build/ios_project -maxdepth 3 -name "*.xcodeproj" | head -n 1)
          echo "Using Xcode project: ${XCODEPROJ}"
          xcodebuild -project "${XCODEPROJ}" \
            -scheme "${SCHEME_NAME}" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Patch Info.plist app name (ASCII, sideload-safe)
        # AltServer 用免費 Apple ID 申請 App ID 時會把 CFBundleDisplayName/
        # CFBundleName 送去跟 Apple 開發者 API 登記,含中文字元會被 Apple
        # 那邊拒絕,AltServer 顯示「The name for this app is invalid」。
        # project.godot 的 config/name（俄羅斯方塊對戰）保留給 Android/
        # 桌面版用,這裡只針對要拿去側載的這份 .ipa,把 Info.plist 的顯示
        # 名稱換成純英數字,不影響其他平台的顯示名稱。
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData -maxdepth 5 -name "*.app" | head -n 1)
          PLIST="${APP_PATH}/Info.plist"
          set_plist_string() {
            /usr/libexec/PlistBuddy -c "Set :$1 $2" "${PLIST}" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Add :$1 string $2" "${PLIST}"
          }
          set_plist_string CFBundleDisplayName "${BUNDLE_NAME}"
          set_plist_string CFBundleName "${BUNDLE_NAME}"
          /usr/libexec/PlistBuddy -c "Print :CFBundleDisplayName" "${PLIST}"
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" "${PLIST}"

      - name: Package unsigned .ipa
        run: |
          set -euo pipefail
          APP_PATH=$(find build/DerivedData -maxdepth 5 -name "*.app" | head -n 1)
          echo "Using app bundle: ${APP_PATH}"
          mkdir -p build/Payload
          cp -r "${APP_PATH}" build/Payload/
          cd build
          zip -qr "${BUNDLE_NAME}-unsigned.ipa" Payload
          cd ..

      - name: Upload .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BUNDLE_NAME }}-unsigned-ipa
          path: build/${{ env.BUNDLE_NAME }}-unsigned.ipa
          retention-days: 14
